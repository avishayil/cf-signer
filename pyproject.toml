[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-signer"
version = "0.1.0"
description = "Tool for Signing and Verifying Signatures of CloudFormation Templates"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Avishay Bar", email = "avishay.il@gmail.com" },
]
keywords = ["cloudformation", "signing", "verification", "aws", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Click>=8.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "pylint>=3.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
cf-signer = "cf_signer.cli:main"

[project.urls]
Homepage = "https://github.com/avishayil/cf-signer"
Repository = "https://github.com/avishayil/cf-signer"
Documentation = "https://cf-signer.readthedocs.io"

[tool.setuptools.packages.find]
include = ["cf_signer", "cf_signer.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
